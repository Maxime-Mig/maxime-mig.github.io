<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Trace liste de tâches du stage</title>
  <desc id="desc">Schéma simple de la liste de tâches issue du débrief de début de stage.</desc>
  <rect width="960" height="640" fill="#fbfcf7"/>
  <rect x="70" y="70" width="860" height="500" rx="20" fill="#ffffff" stroke="#d4dacd" stroke-width="4"/>
  <text x="104" y="126" fill="#1b2430" font-family="Arial, sans-serif" font-size="30" font-weight="700">Débrief initial → liste de tâches</text>
  <rect x="104" y="166" width="260" height="90" rx="12" fill="#e9f0ff" stroke="#2563eb" stroke-width="3"/>
  <text x="132" y="220" fill="#174a9c" font-family="Arial, sans-serif" font-size="24" font-weight="700">Débrief entreprise</text>
  <rect x="430" y="166" width="260" height="90" rx="12" fill="#fff4df" stroke="#c2410c" stroke-width="3"/>
  <text x="468" y="220" fill="#8a3a05" font-family="Arial, sans-serif" font-size="24" font-weight="700">Notes prises</text>
  <rect x="104" y="330" width="790" height="150" rx="16" fill="#f7f7f7" stroke="#334155" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="132" y="360" width="130" height="56" rx="8" fill="#e6f5ee"/>
    <text x="154" y="395" fill="#0f6d3b">Accueil</text>
    <rect x="286" y="360" width="130" height="56" rx="8" fill="#fff4df"/>
    <text x="306" y="395" fill="#8a3a05">Articles</text>
    <rect x="440" y="360" width="130" height="56" rx="8" fill="#f7eafa"/>
    <text x="456" y="395" fill="#8c2854">Événements</text>
    <rect x="594" y="360" width="150" height="56" rx="8" fill="#e0f7fb"/>
    <text x="622" y="395" fill="#0f6575">Multimédia</text>
    <rect x="766" y="360" width="90" height="56" rx="8" fill="#eef2ff"/>
    <text x="788" y="395" fill="#5b35ad">Live</text>
  </g>
  <text x="132" y="454" fill="#253044" font-family="Arial, sans-serif" font-size="21" font-weight="700">À faire → En cours → À montrer → Validé</text>
  <g fill="none" stroke="#253044" stroke-width="6" stroke-linecap="round">
    <path d="M364 210h66"/>
    <path d="M560 256v74"/>
