<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Administration des contenus WordPress</title>
  <desc id="desc">Schéma reliant l'administration WordPress aux pages d'articles, aux cartes de l'accueil et aux boosters.</desc>
  <rect width="900" height="560" fill="#f5f1eb"/>
  <rect x="315" y="28" width="270" height="72" fill="#111111" stroke="#111111" stroke-width="3"/>
  <text x="450" y="58" fill="#ffff00" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Administration</text>
  <text x="450" y="84" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">WordPress</text>

  <path d="M450 100V145M450 145H155V180M450 145V180M450 145H745V180" fill="none" stroke="#111111" stroke-width="4"/>

  <rect x="35" y="180" width="240" height="220" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <rect x="35" y="180" width="240" height="48" fill="#2878f0"/>
  <text x="155" y="211" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Pages d'articles</text>
  <text x="55" y="260" font-family="Arial, sans-serif" font-size="17">• Profils visuels</text>
  <text x="55" y="292" font-family="Arial, sans-serif" font-size="17">• Couleurs et polices</text>
  <text x="55" y="324" font-family="Arial, sans-serif" font-size="17">• Images et médias</text>
  <text x="55" y="356" font-family="Arial, sans-serif" font-size="17">• Catégorie ou article</text>
  <text x="55" y="388" font-family="Arial, sans-serif" font-size="17">• Déclinaisons</text>

  <rect x="330" y="180" width="240" height="220" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <rect x="330" y="180" width="240" height="48" fill="#20b75a"/>
  <text x="450" y="211" fill="#071b0f" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Page d'accueil</text>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="17">• Choix des contenus</text>
  <text x="350" y="292" font-family="Arial, sans-serif" font-size="17">• Ordre des cartes</text>
  <text x="350" y="324" font-family="Arial, sans-serif" font-size="17">• Média principal</text>
  <text x="350" y="356" font-family="Arial, sans-serif" font-size="17">• Style et couleur</text>
  <text x="350" y="388" font-family="Arial, sans-serif" font-size="17">• Événements affichés</text>

  <rect x="625" y="180" width="240" height="220" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <rect x="625" y="180" width="240" height="48" fill="#7c3aed"/>
  <text x="745" y="211" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Boosters</text>
  <text x="645" y="260" font-family="Arial, sans-serif" font-size="17">• Activation et thème</text>
  <text x="645" y="292" font-family="Arial, sans-serif" font-size="17">• Images et couleurs</text>
  <text x="645" y="324" font-family="Arial, sans-serif" font-size="17">• Textes positionnés</text>
  <text x="645" y="356" font-family="Arial, sans-serif" font-size="17">• Cartes sélectionnées</text>
  <text x="645" y="388" font-family="Arial, sans-serif" font-size="17">• Aperçu du résultat</text>

  <path d="M155 400V452H450M450 400V480M745 400V452H450" fill="none" stroke="#111111" stroke-width="4"/>
  <polygon points="450,500 438,478 462,478" fill="#111111"/>
  <rect x="310" y="500" width="280" height="44" fill="#ffff00" stroke="#111111" stroke-width="3"/>
  <text x="450" y="529" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Affichage public modifié</text>
</svg>
