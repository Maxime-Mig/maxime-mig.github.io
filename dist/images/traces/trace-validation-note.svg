<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Trace validations équipe</title>
  <desc id="desc">Schéma simple des validations ponctuelles avec les trois membres de Good Geek.</desc>
  <rect width="960" height="640" fill="#f7f2ea"/>
  <rect x="170" y="64" width="620" height="512" rx="20" fill="#fffefa" stroke="#c9c0ad" stroke-width="4"/>
  <rect x="220" y="110" width="520" height="54" rx="8" fill="#1b2430"/>
  <text x="252" y="146" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Validation progressive du site</text>
  <g font-family="Arial, sans-serif" font-size="20">
    <text x="242" y="214" fill="#174a9c" font-weight="700">Travail réalisé seul</text>
    <rect x="242" y="230" width="478" height="56" rx="8" fill="#e9f0ff" stroke="#2563eb"/>
    <text x="264" y="266" fill="#253044">Une page ou une fonctionnalité est prête.</text>
    <text x="242" y="334" fill="#8a3a05" font-weight="700">Présentation à l'équipe</text>
    <rect x="242" y="350" width="478" height="56" rx="8" fill="#fff4df" stroke="#c2410c"/>
    <text x="264" y="386" fill="#253044">Retour de la développeuse ou des membres.</text>
    <text x="242" y="454" fill="#0f6d3b" font-weight="700">Correction ou validation</text>
    <rect x="242" y="470" width="478" height="56" rx="8" fill="#e6f5ee" stroke="#15803d"/>
    <text x="264" y="506" fill="#253044">La partie avance ou revient en correction.</text>
  </g>
  <path d="M734 498l46 46 92-116" fill="none" stroke="#15803d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
