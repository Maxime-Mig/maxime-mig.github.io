<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Organisation du projet après le débrief initial</title>
  <desc id="desc">Reconstitution d'un tableau de suivi présentant les attentes de l'entreprise, leur transformation en tâches et leur avancement.</desc>

  <rect width="1200" height="760" fill="#f6f4ee"/>
  <rect x="28" y="28" width="1144" height="704" fill="#ffffff" stroke="#171717" stroke-width="3"/>

  <text x="60" y="78" fill="#171717" font-family="Arial, sans-serif" font-size="31" font-weight="700">Organisation du projet après le changement de mission</text>
  <text x="60" y="108" fill="#555555" font-family="Arial, sans-serif" font-size="17">Reconstitution de la liste de tâches construite à partir du débrief de début de stage</text>

  <rect x="60" y="138" width="310" height="145" fill="#fff7d6" stroke="#d3a900" stroke-width="3"/>
  <text x="82" y="171" fill="#171717" font-family="Arial, sans-serif" font-size="21" font-weight="700">Débrief initial</text>
  <g fill="#252525" font-family="Arial, sans-serif" font-size="17">
    <text x="82" y="203">• Site consacré à la communication</text>
    <text x="82" y="228">• Articles et événements</text>
    <text x="82" y="253">• Contenus modifiables</text>
    <text x="82" y="278">• Réseaux sociaux et directs</text>
  </g>

  <path d="M390 210H488" fill="none" stroke="#171717" stroke-width="4"/>
  <path d="M488 210l-16-10v20z" fill="#171717"/>
  <text x="395" y="190" fill="#555555" font-family="Arial, sans-serif" font-size="15">reformulation</text>

  <rect x="510" y="153" width="626" height="112" fill="#eef5ff" stroke="#2563eb" stroke-width="3"/>
  <text x="535" y="190" fill="#173f83" font-family="Arial, sans-serif" font-size="21" font-weight="700">Transformation des attentes en tâches vérifiables</text>
  <text x="535" y="221" fill="#252525" font-family="Arial, sans-serif" font-size="17">Structure du thème • pages publiques • administration • contenus dynamiques</text>
  <text x="535" y="247" fill="#252525" font-family="Arial, sans-serif" font-size="17">styles • responsive • services externes • tests</text>

  <text x="60" y="329" fill="#171717" font-family="Arial, sans-serif" font-size="24" font-weight="700">Tableau de suivi</text>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="350" width="260" height="52" fill="#e8edf2" stroke="#171717" stroke-width="2"/>
    <rect x="333" y="350" width="260" height="52" fill="#fff0c2" stroke="#171717" stroke-width="2"/>
    <rect x="606" y="350" width="260" height="52" fill="#dcecff" stroke="#171717" stroke-width="2"/>
    <rect x="879" y="350" width="257" height="52" fill="#dff3e5" stroke="#171717" stroke-width="2"/>
    <g fill="#171717" font-size="20" font-weight="700" text-anchor="middle">
      <text x="190" y="383">À faire</text>
      <text x="463" y="383">En cours</text>
      <text x="736" y="383">À montrer</text>
      <text x="1007" y="383">Validé</text>
    </g>

    <g fill="#ffffff" stroke="#777777" stroke-width="2">
      <rect x="75" y="420" width="230" height="62"/>
      <rect x="75" y="496" width="230" height="62"/>
      <rect x="75" y="572" width="230" height="62"/>
      <rect x="348" y="420" width="230" height="62"/>
      <rect x="348" y="496" width="230" height="62"/>
      <rect x="348" y="572" width="230" height="62"/>
      <rect x="621" y="420" width="230" height="62"/>
      <rect x="621" y="496" width="230" height="62"/>
      <rect x="621" y="572" width="230" height="62"/>
      <rect x="894" y="420" width="227" height="62"/>
      <rect x="894" y="496" width="227" height="62"/>
      <rect x="894" y="572" width="227" height="62"/>
    </g>

    <g fill="#222222" font-size="17" font-weight="700" text-anchor="middle">
      <text x="190" y="447">Détection automatique</text><text x="190" y="469">des directs</text>
      <text x="190" y="533">Responsive</text>
      <text x="190" y="609">Tests finaux</text>

      <text x="463" y="447">Page multimédia</text><text x="463" y="469" fill="#b42318">Priorité revue</text>
      <text x="463" y="523">Filtres et répartition</text><text x="463" y="545">des articles</text>
      <text x="463" y="609">Champs personnalisés</text>

      <text x="736" y="457">Page d'accueil</text>
      <text x="736" y="533">Page événements</text>
      <text x="736" y="609">Cartes et boosters</text>

      <text x="1007" y="457">Structure du thème</text>
      <text x="1007" y="533">Articles et modèles</text>
      <text x="1007" y="609">Navigation principale</text>
    </g>
  </g>

  <path d="M575 603 C640 660 790 660 894 538" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="9 7"/>
  <path d="M894 538l-16 2 11 12z" fill="#7c3aed"/>
  <rect x="601" y="650" width="285" height="38" fill="#f1eaff" stroke="#7c3aed" stroke-width="2"/>
  <text x="743" y="675" fill="#5423a6" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Dépendance : données avant affichage</text>

  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="60" y="670" width="445" height="35" fill="#fff1f0" stroke="#b42318" stroke-width="2"/>
    <text x="78" y="693" fill="#8f1d14" font-weight="700">Réajustement :</text>
    <text x="190" y="693" fill="#3b2220">la partie multimédia aurait dû être étudiée plus tôt.</text>
  </g>
</svg>
