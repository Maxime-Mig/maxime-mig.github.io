<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Image de partage</title>
    <!-- Modèle de l'image Open Graph (1200 × 630). Les {{…}} sont remplacés par scripts/captures.mjs. -->
    <style>
      @font-face {
        font-family: 'Source Sans 3';
        src: url('{{SOURCE_SANS}}') format('woff2');
        font-weight: 200 900;
      }
      @font-face {
        font-family: 'Special Elite';
        src: url('{{SPECIAL_ELITE}}') format('woff2');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      /* La nappe vichy du site, entre deux bords de table. */
      body {
        position: relative;
        border-block: 16px solid #d3c5aa;
        background:
          linear-gradient(90deg, rgba(138, 165, 196, 0.3) 50%, transparent 50%) 0 0 / 120px 120px,
          linear-gradient(rgba(138, 165, 196, 0.3) 50%, transparent 50%) 0 0 / 120px 120px,
          #f3f4f2;
        color: #212429;
        font-family: 'Source Sans 3', sans-serif;
      }

      .text {
        position: absolute;
        left: 60px;
        top: 96px;
        padding: 44px 48px 38px;
        background: #fdfdfb;
        box-shadow: 4px 6px 0 rgba(40, 55, 70, 0.28);
      }

      h1 {
        margin: 0;
        font-family: 'Special Elite', monospace;
        font-size: 92px;
        font-weight: 400;
        line-height: 1;
      }

      .role {
        margin: 18px 0 0;
        font-size: 34px;
        line-height: 1.3;
      }

      .url {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 18px 6px;
        background: #fbe08a;
        font-family: 'Special Elite', monospace;
        font-size: 28px;
      }

      .scene {
        position: absolute;
        right: 60px;
        top: 70px;
        width: 480px;
        height: 330px;
      }

      /* Les deux moitiés du cookie du jeu partagent le même cadre. */
      .half {
        position: absolute;
        left: 50%;
        top: 0;
        width: 330px;
        transform-origin: 50% 90%;
      }

      .left {
        transform: translateX(-62%) rotate(-9deg);
      }

      .right {
        transform: translateX(-38%) rotate(8deg);
      }

      .shadow {
        position: absolute;
        left: 22%;
        right: 22%;
        top: 270px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(40, 55, 70, 0.35), transparent);
      }

      /* Papier du jeu : blanc cassé, liserés rouges, ombre nette. Il sort de l'image à droite,
         comme le ruban du site qui continue le long de la page. */
      .slip {
        position: absolute;
        left: 690px;
        right: -40px;
        top: 360px;
        margin: 0;
        padding: 22px 70px 22px 34px;
        background:
          linear-gradient(rgba(176, 48, 59, 0.75), rgba(176, 48, 59, 0.75)) 14px 9px / 100% 2px no-repeat,
          linear-gradient(rgba(176, 48, 59, 0.75), rgba(176, 48, 59, 0.75)) 14px calc(100% - 9px) / 100% 2px no-repeat,
          #fbf9f2;
        box-shadow:
          3px 6px 0 rgba(40, 55, 70, 0.26),
          6px 12px 0 rgba(40, 55, 70, 0.1);
        color: #212429;
        font-family: 'Special Elite', monospace;
        font-size: 25px;
        line-height: 1.3;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>Maxime<br />Miguet</h1>
      <p class="role">Développeur jeux vidéo et web<br />Étudiant en BUT Informatique</p>
      <span class="url">maxime-mig.github.io</span>
    </div>

    <div class="scene">
      <span class="shadow"></span>
      <img class="half left" src="{{COOKIE_LEFT}}" alt="" />
      <img class="half right" src="{{COOKIE_RIGHT}}" alt="" />
    </div>
    <p class="slip">Tu vas rencontrer quelqu’un.<br />Probablement un pigeon.</p>
  </body>
</html>
