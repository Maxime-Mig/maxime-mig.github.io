<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Image de partage</title>
    <!-- Modèle de l'image Open Graph (1200 × 630). Les {{…}} sont remplacés par scripts/captures.mjs. -->
    <style>
      @font-face {
        font-family: 'Bagel Fat One';
        src: url('{{BAGEL}}') format('woff2');
      }
      @font-face {
        font-family: 'Figtree';
        src: url('{{FIGTREE}}') format('woff2');
        font-weight: 300 900;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      /* Le haut de la page d'accueil : aplat rose, nom, cookie, doigt et pigeon. */
      body {
        position: relative;
        background: #ffb8cf;
        color: #33121f;
        font-family: 'Figtree', sans-serif;
      }

      h1 {
        position: absolute;
        left: 60px;
        top: 52px;
        margin: 0;
        font-family: 'Bagel Fat One', sans-serif;
        font-size: 186px;
        font-weight: 400;
        line-height: 0.84;
        letter-spacing: -0.015em;
      }

      p {
        position: absolute;
        left: 64px;
        top: 442px;
        margin: 0;
        font-size: 36px;
        font-weight: 700;
        line-height: 1.3;
      }

      .url {
        top: 530px;
        padding: 10px 20px;
        border-radius: 14px;
        background: #33121f;
        color: #ffb8cf;
        font-size: 28px;
      }

      img,
      .shadow {
        position: absolute;
      }

      .shadow {
        left: 700px;
        top: 520px;
        width: 420px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(51, 18, 31, 0.45), transparent);
      }

      .cookie {
        left: 645px;
        top: 100px;
        width: 520px;
      }

      .arm {
        left: 950px;
        top: -95px;
        width: 600px;
      }

      .pigeon {
        left: 606px;
        top: 412px;
        width: 225px;
      }
    </style>
  </head>
  <body>
    <h1>Maxime<br />Miguet</h1>
    <p>Développeur jeux vidéo et web</p>
    <p class="url">maxime-mig.github.io</p>

    <span class="shadow"></span>
    <img class="cookie" src="{{COOKIE}}" alt="" />
    <img class="arm" src="{{ARM}}" alt="" />
    <img class="pigeon" src="{{PIGEON}}" alt="" />
  </body>
</html>
