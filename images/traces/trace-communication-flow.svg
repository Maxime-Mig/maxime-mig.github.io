<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Trace échanges avec l'équipe</title>
  <desc id="desc">Circuit simple entre travail seul, question, retour de l'équipe et validation.</desc>
  <rect width="960" height="640" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="160" cy="320" r="82" fill="#e9f0ff" stroke="#2563eb" stroke-width="4"/>
    <text x="160" y="312" fill="#174a9c" font-size="24" font-weight="700">Travail</text>
    <text x="160" y="344" fill="#253044" font-size="18">seul</text>
    <circle cx="350" cy="190" r="82" fill="#fff4df" stroke="#c2410c" stroke-width="4"/>
    <text x="350" y="182" fill="#8a3a05" font-size="24" font-weight="700">Question</text>
    <text x="350" y="214" fill="#253044" font-size="18">référente</text>
    <circle cx="590" cy="190" r="82" fill="#f7eafa" stroke="#be185d" stroke-width="4"/>
    <text x="590" y="182" fill="#8c2854" font-size="24" font-weight="700">Retour</text>
    <text x="590" y="214" fill="#253044" font-size="18">équipe</text>
    <circle cx="780" cy="320" r="82" fill="#e6f5ee" stroke="#15803d" stroke-width="4"/>
    <text x="780" y="312" fill="#0f6d3b" font-size="24" font-weight="700">Correction</text>
    <text x="780" y="344" fill="#253044" font-size="18">si besoin</text>
    <circle cx="470" cy="464" r="82" fill="#ffffff" stroke="#6d28d9" stroke-width="4"/>
    <text x="470" y="456" fill="#5b35ad" font-size="24" font-weight="700">Validation</text>
    <text x="470" y="488" fill="#253044" font-size="18">ponctuelle</text>
  </g>
  <g fill="none" stroke="#253044" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 272l54-38"/>
    <path d="M432 190h76"/>
    <path d="M656 236l58 40"/>
    <path d="M720 370l-170 70"/>
    <path d="M390 448l-170-78"/>
  </g>
</svg>
